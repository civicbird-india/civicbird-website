<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Reset your CivicBird account password securely.">
<meta name="theme-color" content="#102b46">
<title>Reset Password | CivicBird</title>
<link rel="icon" href="logo.png" type="image/svg+xml"><link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body data-page="forgot-password">
<div id="siteHeader"></div>
<main id="mainContent">
<section class="section section-soft"><div class="container auth-shell"><div class="auth-head"><span class="eyebrow">Account recovery</span><h1 style="font-size:2.5rem">Reset your password</h1><p>Enter the email address associated with your account. If it is registered, Firebase will send a reset link.</p></div><section class="panel"><form id="resetForm"><div class="field"><label for="email">Email address *</label><input id="email" type="email" required autocomplete="email" maxlength="150" placeholder="you@example.com"></div><button class="btn btn-primary btn-block" style="margin-top:18px" type="submit">Send reset link</button><div id="formStatus" class="status" role="status" aria-live="polite"></div></form><div class="divider"></div><a href="login.html">Return to login</a></section></div></section>
</main>
<div id="siteFooter"></div>
<div id="globalStatus" class="container status" role="status" aria-live="polite"></div>
</body></html>
