<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Create a CivicBird customer account.">
<meta name="theme-color" content="#102b46">
<title>Create Account | CivicBird</title>
<link rel="icon" href="logo.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body data-page="signup">
<div id="siteHeader"></div>
<main id="mainContent">
<section class="section section-soft"><div class="container auth-shell"><div class="auth-head"><span class="eyebrow">Customer account</span><h1 style="font-size:2.6rem">Create your account</h1><p>Register to submit service requests and view your bookings.</p></div><section class="panel"><div class="tabs"><a href="login.html">Login</a><a class="active" href="signup.html">Create account</a></div><form id="signupForm"><div class="form-grid"><div class="field full"><label for="fullName">Full name *</label><input id="fullName" required maxlength="100" autocomplete="name"></div><div class="field"><label for="phone">Mobile number *</label><input id="phone" required inputmode="tel" pattern="[0-9+() -]{8,18}" autocomplete="tel"></div><div class="field"><label for="email">Email address *</label><input id="email" type="email" required maxlength="150" autocomplete="email"></div><div class="field full"><label for="password">Password *</label><div class="password-wrap"><input id="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password"><button class="password-toggle" type="button" data-target="password" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><small>Use at least 8 characters. Never reuse your email password.</small></div><div class="field full"><label for="confirmPassword">Confirm password *</label><div class="password-wrap"><input id="confirmPassword" type="password" required minlength="8" maxlength="128" autocomplete="new-password"><button class="password-toggle" type="button" data-target="confirmPassword" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><div class="field full"><label class="checkline"><input type="checkbox" required><span>I agree to the <a href="terms.html">Terms & Conditions</a> and acknowledge the <a href="privacy.html">Privacy Policy</a>. *</span></label></div><div class="field full"><button class="btn btn-primary btn-block" type="submit">Create account</button><div id="formStatus" class="status" role="status" aria-live="polite"></div></div></div></form></section></div></section>
</main>
<div id="siteFooter"></div>
<div id="globalStatus" class="container status" role="status" aria-live="polite"></div>
</body></html>
